name: do-crime-pexels-robbery-probe

on:
  push:
    branches:
      - chatgpt-do-crime-pexels-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg tooling
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl fonts-dejavu-core
          ffmpeg -version | head -n 2

      - name: Probe 4K robbery stock
        shell: bash
        run: |
          chmod +x chatgpt_do_crime/probe_pexels_robbery.sh
          chatgpt_do_crime/probe_pexels_robbery.sh

      - name: Upload visual review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-pexels-robbery-probe
          path: probe/
          compression-level: 6
          retention-days: 2
          if-no-files-found: warn
