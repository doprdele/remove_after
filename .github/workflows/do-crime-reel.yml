name: do-crime-reel

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install media toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core fonts-gfs-didot curl
          python -m pip install --upgrade pip pillow
          ffmpeg -version | head -n 2

      - name: Patch renderer to direct high-resolution public sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('chatgpt_do_crime/do_crime_render.sh')
          s=p.read_text()
          m=re.search(r'# Exact requested Godard supermarket sequence, real FARC documentary footage, and real flag-burning protest footage\..*?# Exact track version',s,re.S)
          if not m: raise SystemExit('documentary source block not found')
          block=r'''# Direct public-media sources only; no generated imagery or Runway.
          # The accessible moving mirrors for these two historical scenes are sub-HD,
          # so use high-resolution genuine archival frames and animate only with FFmpeg.
          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/FARC_guerrillas_during_the_Caguan_peace_talks_(1998-2002).jpg' work/raw/farc_archival.jpg
          fetch 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhwpLzuBN8_34_vp-D4gYR_rX3PdXnbI1dsgdtHtJk3IA2usnxrvZB3GLW7qdhSdvTkA0IIcHE7PG9xiXvOt-_GFR5vj0PiPSNo4X0I2renYG3st07fGTrZPm49TrMC1lDci7FcB12DrVE/s0/Screen%2Bshot%2B2010-11-27%2Bat%2B4.57.32%2BPM.png' work/raw/tout_archival.png
          ffmpeg -y -hide_banner -loglevel warning -loop 1 -framerate 60 -i work/raw/farc_archival.jpg -vf "scale=2200:-2:flags=lanczos,zoompan=z='1.05+0.00035*on':x='iw/2-(iw/zoom/2)+sin(on/24)*55':y='ih/2-(ih/zoom/2)':d=1200:s=1920x1080:fps=60,setsar=1,format=yuv420p" -t 20 -an -c:v libx264 -preset veryfast -crf 16 work/raw/farc.mp4
          ffmpeg -y -hide_banner -loglevel warning -loop 1 -framerate 60 -i work/raw/tout_archival.png -vf "scale=2400:-2:flags=lanczos,zoompan=z='1.07+0.00028*on':x='iw/2-(iw/zoom/2)+sin(on/18)*80':y='ih/2-(ih/zoom/2)':d=1200:s=1920x1080:fps=60,setsar=1,format=yuv420p" -t 20 -an -c:v libx264 -preset veryfast -crf 16 work/raw/tout.mp4

          # Genuine left-wing flag-burning protest, native 1920x1080 CC source.
          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/DNC_Day_4-_Protesters_Attempt_To_Burn_A_Flag.webm' work/raw/flag.webm
          ffmpeg -y -hide_banner -loglevel warning -i work/raw/flag.webm -t 21 -an -c:v libx264 -preset veryfast -crf 17 -movflags +faststart work/raw/flag.mp4

          # Official Apple public preview of Zericxxn - Raya (Slowed).
          fetch 'https://itunes.apple.com/search?term=Raya%20Slowed%20Zericxxn&entity=song&limit=25' work/audio/itunes.json
          preview=$(jq -r '.results[] | select((.artistName|ascii_downcase)=="zericxxn" and (.trackName|ascii_downcase|contains("raya")) and (.trackName|ascii_downcase|contains("slowed")) and ((.trackName|ascii_downcase|contains("super"))|not) and ((.trackName|ascii_downcase|contains("ultra"))|not)) | .previewUrl' work/audio/itunes.json | head -n1)
          test -n "$preview"; test "$preview" != null
          fetch "$preview" work/audio/raya_preview.m4a
          ffmpeg -y -v warning -i work/audio/raya_preview.m4a -vn -c:a aac -b:a 256k -ar 48000 -ac 2 work/audio/raya_master.m4a

          # Exact track version'''
          s=s[:m.start()]+block+s[m.end():]
          a=s.index('# Exact track version', s.index('work/audio/raya_master.m4a'))
          b=s.index('# Hard source-resolution gate', a)
          s=s[:a]+s[b:]
          s=s.replace('S=3/11; N=55','S=15/49; N=49')
          s=s.replace("zip([7,8,9,10],[0,20,40,54])","zip([7,8,9,10],[0,17,34,48])")
          s=s.replace('-i work/src/flag.mp4 -ss 44.742 -i work/audio/raya_master.m4a','-i work/src/flag.mp4 -i work/audio/raya_master.m4a')
          s=s.replace('# 55 eighth-note slots at 110 BPM','# 49 eighth-note slots at 98 BPM')
          p.write_text(s)
          low=s.lower()
          assert 'dnznrvs05pmza.cloudfront.net' not in low
          assert 'youtube.com/watch' not in low and 'vimeo.com/' not in low and 'audiomack.com' not in low
          assert 'S=15/49; N=49' in s
          print('Direct public-media renderer patched; 98 BPM grid')
          PY

      - name: Render reel
        shell: bash
        run: |
          mkdir -p work/qc output
          set -o pipefail
          bash chatgpt_do_crime/do_crime_render.sh 2>&1 | tee work/qc/build.log

      - name: Verify technical requirements
        if: success()
        run: |
          python - <<'PY'
          import json,subprocess
          p='output/do_crime_dont_vote_reel.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_entries','format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels,nb_read_frames','-of','json',p])
          d=json.loads(raw); ss={x['codec_type']:x for x in d['streams']}; v=ss['video']; a=ss['audio']
          assert abs(float(d['format']['duration'])-15.0)<.025,d
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['codec_name']=='h264' and v['r_frame_rate']=='60/1',v
          assert int(v['nb_read_frames'])==900,v
          assert a['codec_name']=='aac' and a['sample_rate']=='48000',a
          open('work/qc/verified_ffprobe.json','wb').write(raw)
          print('FINAL QC PASSED')
          PY
          ffmpeg -v error -i output/do_crime_dont_vote_reel.mp4 -f null -

      - name: Upload output and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-dont-vote-reel
          path: |
            output/
            work/qc/
            chatgpt_do_crime/do_crime_render.sh
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
