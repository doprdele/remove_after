name: cremated-v2-canberra
on:
  push:
    branches: [chatgpt-cremated-reel-v2-20260905]
    paths: ['.github/workflows/cremated-v2-canberra.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade 'yt-dlp[default]' curl-cffi
      - name: Retrieve public Vimeo page
        run: |
          python -u - <<'PY'
          from pathlib import Path
          code=Path('cremated-reel/fetch_active_cremation_v2.py').read_text()
          code=code[:code.index('with cf.ThreadPoolExecutor')]
          exec(code)
          get(('canberra','https://vimeo.com/842357988'))
          PY
      - name: Preserve inspection candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cremated-v2-canberra
          path: active_cremation_v2/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
