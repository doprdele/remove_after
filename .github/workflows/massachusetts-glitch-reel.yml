name: Massachusetts Glitch Reel

on:
  push:
    branches: [master]
    paths:
      - 'reel_build/build_glitch_massachusetts.py'
      - '.github/workflows/massachusetts-glitch-reel.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install media stack and PO-token provider
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-opencv python3-numpy
          python3 -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          node --version
          git clone --depth 1 --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc
      - name: Configure yt-dlp with PO-token provider
        run: |
          REAL_YTDLP="$(command -v yt-dlp)"
          PROVIDER_HOME="$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          mkdir -p "$RUNNER_TEMP/ytdlp-bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "exec \"$REAL_YTDLP\" --extractor-args 'youtube:player_client=mweb' --extractor-args \"youtubepot-bgutilscript:server_home=$PROVIDER_HOME\" --js-runtimes node --remote-components ejs:github \"\$@\"" \
            > "$RUNNER_TEMP/ytdlp-bin/yt-dlp"
          chmod +x "$RUNNER_TEMP/ytdlp-bin/yt-dlp"
          echo "$RUNNER_TEMP/ytdlp-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ytdlp-bin/yt-dlp" -v --skip-download 'https://www.youtube.com/watch?v=85d6sxqJcQ0' | tail -40
      - name: Patch final emotional beat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reel_build/build_glitch_massachusetts.py')
          s=p.read_text()
          old="Shot(30,'castle',5,.62,'washed','full','separated',3,0),"
          new="Shot(30,'shinji',4,.48,'mono','full','separated',4,3),\nShot(30,'castle',5,.62,'washed','full','separated',3,0),"
          if new not in s:
              if old not in s: raise SystemExit('timeline anchor not found')
              s=s.replace(old,new)
          p.write_text(s)
          print('timeline patched')
          PY
      - name: Build reel
        run: python3 reel_build/build_glitch_massachusetts.py
      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: massachusetts-glitch-separation-reel
          path: |
            reel_build/output/massachusetts_glitch_separation_reel.mp4
            reel_build/build_glitch_massachusetts.py
          if-no-files-found: error
          retention-days: 7
