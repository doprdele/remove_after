name: do-crime-github-final-v3

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
    paths:
      - '.github/workflows/do-crime-github-final-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-do-crime-reel-20260903
          fetch-depth: 1

      - name: Install render dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'yt-dlp[default]' curl-cffi pillow opencv-python-headless
          yt-dlp --version
          ffmpeg -version | head -n 2

      - name: Patch JSON capture and run build
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
from pathlib import Path
p=Path('do-crime-actions/build_final.py')
s=p.read_text()
s=s.replace('stderr=subprocess.STDOUT if capture else None,', 'stderr=subprocess.PIPE if capture else None,')
s=s.replace('if capture and p.stdout:\n            print(p.stdout[-8000:])', 'if capture and (p.stderr or p.stdout):\n            print((p.stderr or p.stdout)[-8000:])')
p.write_text(s)
PY
          python -m py_compile do-crime-actions/build_final.py do-crime-actions/select_source.py
          set +e
          set -o pipefail
          rm -rf gha-status-v3
          mkdir -p gha-status-v3
          python do-crime-actions/build_final.py 2>&1 | tee github_actions_final_build_v3.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > build_exit_code_v3.txt
          if [[ "$rc" -eq 0 ]]; then
            echo SUCCESS > gha-status-v3/final_status.txt
          else
            echo "FAILED exit_code=$rc" > gha-status-v3/final_status.txt
          fi
          cp github_actions_final_build_v3.log gha-status-v3/github_actions_final_build.log
          date -u +%FT%TZ > gha-status-v3/finished_at_utc.txt
          exit 0

      - name: Add reproducibility files on success
        run: |
          set -euxo pipefail
          rc=$(cat build_exit_code_v3.txt)
          if [[ "$rc" -ne 0 ]]; then exit 0; fi
          cp github_actions_final_build_v3.log gha-final/github_actions_final_build.log
          cp .github/workflows/do-crime-github-final-v3.yml gha-final/do-crime-github-final-v3.yml
          python - <<'PY'
from pathlib import Path
import zipfile
zpath=Path('gha-final/do_crime_dont_vote_GITHUB_ACTIONS_repro.zip')
with zipfile.ZipFile(zpath,'a',zipfile.ZIP_DEFLATED) as z:
    z.write('github_actions_final_build_v3.log','github_actions_final_build.log')
    z.write('.github/workflows/do-crime-github-final-v3.yml','do-crime-github-final-v3.yml')
PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-dont-vote-github-actions-final-v3
          path: |
            gha-final/
            gha-status-v3/
            build_exit_code_v3.txt
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

      - name: Commit status and successful deliverables
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config http.postBuffer 524288000
          git add -f gha-status-v3
          if [[ "$(cat build_exit_code_v3.txt 2>/dev/null || echo 1)" -eq 0 ]]; then
            git add -f gha-final
          fi
          git commit -m 'Record GitHub Actions reel build v3' || exit 0
          git pull --rebase origin chatgpt-do-crime-reel-20260903 || true
          git push origin HEAD:chatgpt-do-crime-reel-20260903

      - name: Propagate build failure
        if: always()
        run: |
          rc=$(cat build_exit_code_v3.txt 2>/dev/null || echo 1)
          if [[ "$rc" -ne 0 ]]; then exit "$rc"; fi
