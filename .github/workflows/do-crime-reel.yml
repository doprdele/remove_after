name: do-crime-reel

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core fonts-gfs-didot curl
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" pillow
          yt-dlp --version
          ffmpeg -version | head -n 2
      - name: Remove generated imagery from build
        shell: bash
        run: |
          sed -i "/work\/raw\/farc1.png/c\fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/FARC_guerrillas_during_the_Caguan_peace_talks_(1998-2002).jpg' work/raw/farc1.png" chatgpt_do_crime/do_crime_render.sh
          sed -i "/work\/raw\/farc2.png/c\fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/FARC_guerrillas_marching_during_the_Caguan_peace_talks_(1998-2002).jpg' work/raw/farc2.png" chatgpt_do_crime/do_crime_render.sh
          ! grep -q 'dnznrvs05pmza.cloudfront.net' <(grep 'farc[12].png' chatgpt_do_crime/do_crime_render.sh)
      - name: Render reel
        shell: bash
        run: |
          mkdir -p work/qc output
          set -o pipefail
          bash chatgpt_do_crime/do_crime_render.sh 2>&1 | tee work/qc/build.log
      - name: Upload output and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-dont-vote-reel
          path: |
            output/
            work/qc/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
