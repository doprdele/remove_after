name: farc-source-probe
on:
  push:
    branches: [chatgpt-do-crime-reel-20260903]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FARC field-report sources
        run: |
          set -euxo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq curl ffmpeg >/dev/null
          python -m pip install --upgrade "yt-dlp[default]" >/dev/null
          mkdir -p out

          echo '=== AL JAZEERA PAGE FORMATS ===' | tee out/results.txt
          for u in \
            'https://www.aljazeera.com/news/2011/5/30/life-inside-colombias-farc' \
            'https://www.aljazeera.com/news/2011/11/6/colombia-rebels-bring-services-to-the-jungle'; do
            echo "URL $u" | tee -a out/results.txt
            yt-dlp --no-playlist --list-formats "$u" 2>&1 | tee -a out/results.txt || true
          done

          echo '=== EL ESPECTADOR DIRECT MP4 ===' | tee -a out/results.txt
          U='http://static.elespectador.com/archivos/2011/04/6f5748fbeff512f4eba9706efdbdda2a.mp4'
          curl -LfsS --retry 3 --connect-timeout 15 --max-time 180 "$U" -o out/farc_espectador.mp4 || true
          if [ -s out/farc_espectador.mp4 ]; then
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json out/farc_espectador.mp4 | tee -a out/results.txt
          fi

          echo '=== MODERNGHANA AL JAZEERA MIRROR ===' | tee -a out/results.txt
          yt-dlp --no-playlist --list-formats 'https://www.modernghana.com/videonews/aljazeera/2/657752/' 2>&1 | tee -a out/results.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: farc-source-probe
          path: out/
          retention-days: 1
