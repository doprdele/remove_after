name: archive-probe
on:
  push:
    branches: [chatgpt-do-crime-reel-20260903]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Tout original and exact archived FARC YouTube IDs
        run: |
          set -euxo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq curl ffmpeg >/dev/null
          mkdir -p out

          ITEM='tout.-va.-bien.-1972.-jean-luc.-godard.-1080p.-brrip.x-264-classics'
          curl -fsSL --retry 3 "https://archive.org/metadata/${ITEM}" -o out/tout_metadata.json
          echo '=== TOUT ORIGINAL ==='
          jq -r '.files[] | select(.source=="original" and (.name|endswith(".mkv"))) | [.name,.size,.format,.width,.height,.length] | @tsv' out/tout_metadata.json | tee out/tout_original.tsv

          echo '=== EXACT YOUTUBE-ID ARCHIVE SEARCH ==='
          : > out/exact_search.tsv
          for vid in SKJblKuj84E P6hbaoCuZHg M1OTlP9CV4g; do
            q="identifier:*${vid}* OR title:\"${vid}\" OR description:\"${vid}\""
            curl -G -fsSL --retry 3 'https://archive.org/advancedsearch.php' \
              --data-urlencode "q=${q}" --data-urlencode 'fl[]=identifier' --data-urlencode 'fl[]=title' \
              --data-urlencode 'rows=50' --data-urlencode 'output=json' -o "out/${vid}_search.json"
            jq -r --arg v "$vid" '.response.docs[] | [$v,.identifier,.title] | @tsv' "out/${vid}_search.json" | tee -a out/exact_search.tsv
          done

          echo '=== EXACT CANDIDATE FILES ==='
          : > out/exact_files.tsv
          while IFS=$'\t' read -r vid id title; do
            curl -fsSL --retry 2 "https://archive.org/metadata/${id}" -o out/tmp.json || continue
            jq -r --arg vid "$vid" --arg id "$id" --arg title "$title" '.files[] | select((.name|ascii_downcase|test("\\.(mkv|mp4|webm|mov)$"))) | [$vid,$id,$title,.name,.size,.source,.format,.width,.height,.length] | @tsv' out/tmp.json >> out/exact_files.tsv || true
          done < out/exact_search.tsv
          cat out/exact_files.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: archive-probe
          path: out/
          retention-days: 1
