name: do-crime-reel

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core fonts-gfs-didot curl
          python -m pip install --upgrade pip pillow
          ffmpeg -version | head -n 2

      - name: Patch renderer to direct public media only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('chatgpt_do_crime/do_crime_render.sh')
          s=p.read_text()

          # Replace Vimeo/YouTube-dependent documentary block with direct files.
          old=re.search(r'# Exact requested Godard supermarket sequence, real FARC documentary footage, and real flag-burning protest footage\..*?# Exact track version',s,re.S)
          if not old: raise SystemExit('source block not found')
          direct=r'''# Direct non-generated archival/public sources: no Runway and no YouTube/Vimeo dependency.
          # Exact Tout Va Bien supermarket frame from the requested long tracking-shot sequence.
          fetch 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhwpLzuBN8_34_vp-D4gYR_rX3PdXnbI1dsgdtHtJk3IA2usnxrvZB3GLW7qdhSdvTkA0IIcHE7PG9xiXvOt-_GFR5vj0PiPSNo4X0I2renYG3st07fGTrZPm49TrMC1lDci7FcB12DrVE/s0/Screen%2Bshot%2B2010-11-27%2Bat%2B4.57.32%2BPM.png' work/raw/tout_still.png
          # Genuine FARC archival photograph from DEA Public Affairs / Wikimedia Commons.
          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/FARC_guerrillas_during_the_Caguan_peace_talks_(1998-2002).jpg' work/raw/farc_still.jpg
          # Genuine Revolutionary Communist Party flag-burning protest, 1920x1080 CC footage.
          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/DNC_Day_4-_Protesters_Attempt_To_Burn_A_Flag.webm' work/raw/flag.webm

          # Turn the two genuine archival stills into moving FFmpeg masters; no generated imagery.
          ffmpeg -y -v warning -loop 1 -framerate 60 -i work/raw/farc_still.jpg -vf "scale=2200:-2:flags=lanczos,zoompan=z='1.08+0.00030*on':x='iw/2-(iw/zoom/2)+sin(on/38)*45':y='ih/2-(ih/zoom/2)':d=1200:s=1920x1080:fps=60,setsar=1,format=yuv420p" -t 20 -an -c:v libx264 -preset veryfast -crf 16 work/raw/farc.mp4
          ffmpeg -y -v warning -loop 1 -framerate 60 -i work/raw/tout_still.png -vf "scale=2300:-2:flags=lanczos,zoompan=z='1.10+0.00022*on':x='iw/2-(iw/zoom/2)+sin(on/30)*75':y='ih/2-(ih/zoom/2)':d=1200:s=1920x1080:fps=60,setsar=1,format=yuv420p" -t 20 -an -c:v libx264 -preset veryfast -crf 16 work/raw/tout.mp4
          ffmpeg -y -v warning -stream_loop -1 -i work/raw/flag.webm -t 20 -an -vf 'scale=1920:1080:flags=lanczos,fps=60,setsar=1,format=yuv420p' -c:v libx264 -preset veryfast -crf 17 work/raw/flag.mp4

          # Exact track/version through Apple's public official preview API.
          fetch 'https://itunes.apple.com/search?term=Raya%20Slowed%20Zericxxn&entity=song&limit=25' work/audio/itunes.json
          preview=$(jq -r '.results[] | select((.artistName|ascii_downcase)=="zericxxn" and (.trackName|ascii_downcase|contains("raya")) and (.trackName|ascii_downcase|contains("slowed")) and ((.trackName|ascii_downcase|contains("super"))|not) and ((.trackName|ascii_downcase|contains("ultra"))|not)) | .previewUrl' work/audio/itunes.json | head -n1)
          test -n "$preview"; test "$preview" != null
          fetch "$preview" work/audio/raya_preview.m4a
          ffmpeg -y -v warning -i work/audio/raya_preview.m4a -vn -c:a aac -b:a 256k -ar 48000 -ac 2 work/audio/raya_master.m4a

          # Exact track version'''
          s=s[:old.start()]+direct+s[old.end():]

          # Remove stale Audiomack block that follows the reinserted marker.
          a=s.index('# Exact track version', s.index('work/audio/raya_master.m4a'))
          b=s.index('# Hard source-resolution gate', a)
          s=s[:a]+s[b:]

          # Correct beat grid for Raya (Slowed): 98 BPM; 49 eighth notes = exactly 15 sec.
          s=s.replace('S=3/11; N=55','S=15/49; N=49')
          s=s.replace("zip([7,8,9,10],[0,20,40,54])","zip([7,8,9,10],[0,17,34,48])")
          s=s.replace('-i work/src/flag.mp4 -ss 44.742 -i work/audio/raya_master.m4a','-i work/src/flag.mp4 -i work/audio/raya_master.m4a')
          s=s.replace('# 55 eighth-note slots at 110 BPM', '# 49 eighth-note slots at 98 BPM')
          p.write_text(s)

          low=s.lower()
          assert 'runway' not in low
          assert 'dnznrvs05pmza.cloudfront.net' not in low
          assert 'vimeo.com/' not in low
          assert 'youtube.com/watch' not in low
          assert 'audiomack.com' not in low
          assert 'S=15/49; N=49' in s
          print('Direct-only, non-Runway renderer patched')
          PY

      - name: Render reel
        shell: bash
        run: |
          mkdir -p work/qc output
          set -o pipefail
          bash chatgpt_do_crime/do_crime_render.sh 2>&1 | tee work/qc/build.log

      - name: Verify technical requirements
        if: success()
        run: |
          python - <<'PY'
          import json,subprocess
          p='output/do_crime_dont_vote_reel.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_entries','format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels,nb_read_frames','-of','json',p])
          d=json.loads(raw); s={x['codec_type']:x for x in d['streams']}; v=s['video']; a=s['audio']
          assert abs(float(d['format']['duration'])-15.0)<.025, d
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['codec_name']=='h264' and v['r_frame_rate']=='60/1',v
          assert int(v['nb_read_frames'])==900,v
          assert a['codec_name']=='aac' and a['sample_rate']=='48000',a
          open('work/qc/verified_ffprobe.json','wb').write(raw)
          print('FINAL QC PASSED')
          PY
          ffmpeg -v error -i output/do_crime_dont_vote_reel.mp4 -f null -

      - name: Upload output and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-dont-vote-reel
          path: |
            output/
            work/qc/
            chatgpt_do_crime/do_crime_render.sh
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
