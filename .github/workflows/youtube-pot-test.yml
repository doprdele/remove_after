name: youtube-pot-test

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp PO-token toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" bgutil-ytdlp-pot-provider
          docker pull brainicism/bgutil-ytdlp-pot-provider:1.3.2
          docker run --name bgutil-provider -d --init --network host brainicism/bgutil-ytdlp-pot-provider:1.3.2
          sleep 8
          docker ps -a
          docker logs bgutil-provider
          curl -fsS http://127.0.0.1:4416/ >/dev/null || true
          yt-dlp --version
      - name: Test exact song and one exact source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-output
          NODE_BIN=$(command -v node || true)
          RUNTIME_ARGS=()
          if [ -n "$NODE_BIN" ]; then RUNTIME_ARGS=(--js-runtimes "node:$NODE_BIN"); fi
          POT_ARGS='youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416;youtube:player_client=mweb'
          {
            echo '=== PROVIDER VERIFICATION ==='
            yt-dlp -v "${RUNTIME_ARGS[@]}" --extractor-args "$POT_ARGS" --skip-download 'https://www.youtube.com/watch?v=sUidFU1nPr8'
            echo '=== AUDIO DOWNLOAD ==='
            yt-dlp -v "${RUNTIME_ARGS[@]}" --extractor-args "$POT_ARGS" -f 'bestaudio/best' -x --audio-format m4a --audio-quality 0 -o 'test-output/raya_phonk.%(ext)s' 'https://www.youtube.com/watch?v=sUidFU1nPr8'
            echo '=== VIDEO SECTION DOWNLOAD ==='
            yt-dlp -v "${RUNTIME_ARGS[@]}" --extractor-args "$POT_ARGS" --download-sections '*64-68' --force-keyframes-at-cuts -f 'bestvideo[height>=1080]+bestaudio/best[height>=1080]/best' --merge-output-format mp4 -o 'test-output/cash_test.%(ext)s' 'https://www.youtube.com/watch?v=Hl5_Lc6b3AU'
            for f in test-output/*; do ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$f" || true; done
          } 2>&1 | tee test-output/test.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-pot-test
          path: test-output/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
