name: do-crime-reel

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install media toolchain and YouTube PO-token provider
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core fonts-gfs-didot curl git nodejs npm
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" pillow bgutil-ytdlp-pot-provider
          rm -rf "$HOME/bgutil-ytdlp-pot-provider"
          git clone --depth 1 --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc
          yt-dlp --version
          ffmpeg -version | head -n 2

      - name: Patch build to exact screened YouTube sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('chatgpt_do_crime/do_crime_render.sh')
          s=p.read_text()
          old=re.search(r'get_vimeo\(\)\{.*?\}\nget_vimeo tout .*?\nget_vimeo farc .*?\nget_vimeo flag .*?\n',s,re.S)
          if not old:
              raise SystemExit('could not locate Vimeo source block')
          new=r'''get_yt(){
            key="$1"; id="$2"; section="$3"; echo "YOUTUBE $key $id $section"
            rm -f "work/raw/${key}."* 2>/dev/null || true
            yt-dlp --no-playlist --retries 8 --fragment-retries 8 --socket-timeout 45 --concurrent-fragments 4 --js-runtimes node --remote-components ejs:github \
              --extractor-args 'youtube:player_client=mweb' \
              --download-sections "*$section" --force-keyframes-at-cuts \
              -f 'bestvideo[height>=1080]+bestaudio/best[height>=1080]' --merge-output-format mp4 \
              -o "work/raw/${key}.%(ext)s" "https://www.youtube.com/watch?v=${id}"
            f=$(find work/raw -maxdepth 1 -type f -name "${key}.*" ! -name '*.part' | head -n1)
            test -s "$f"
            mv "$f" "work/raw/${key}.mp4"
          }
          # These ranges were visually screened earlier for no baked captions/logos/news bugs.
          get_yt tout 'AxM9rOVGQO4' '1380-1440'
          get_yt farc 'M1OTlP9CV4g' '20-31'
          get_yt flag 'F1M8THQEROk' '12-34'
          '''
          s=s[:old.start()]+new+s[old.end():]
          # Replace Audiomack fallback with the user's exact supplied YouTube track.
          a=s.index('# Exact track version')
          b=s.index('# Hard source-resolution gate')
          audio=r'''# Exact soundtrack supplied by the user, via the same PO-token path.
          rm -f work/audio/raya.* 2>/dev/null || true
          yt-dlp --no-playlist --retries 8 --fragment-retries 8 --socket-timeout 45 --js-runtimes node --remote-components ejs:github \
            --extractor-args 'youtube:player_client=mweb' -f 'bestaudio/best' -x --audio-format m4a --audio-quality 0 \
            -o 'work/audio/raya.%(ext)s' 'https://www.youtube.com/watch?v=sUidFU1nPr8'
          audio=$(find work/audio -maxdepth 1 -type f -name 'raya.*' ! -name '*.part' | head -n1)
          test -s "$audio"
          ffmpeg -y -v warning -i "$audio" -vn -c:a aac -b:a 256k -ar 48000 -ac 2 work/audio/raya_master.m4a

          '''
          s=s[:a]+audio+s[b:]
          p.write_text(s)
          PY
          ! grep -q 'dnznrvs05pmza.cloudfront.net' chatgpt_do_crime/do_crime_render.sh
          ! grep -q 'audiomack.com' chatgpt_do_crime/do_crime_render.sh

      - name: Render reel
        shell: bash
        run: |
          mkdir -p work/qc output
          set -o pipefail
          bash chatgpt_do_crime/do_crime_render.sh 2>&1 | tee work/qc/build.log

      - name: Upload output and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-dont-vote-reel
          path: |
            output/
            work/qc/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
