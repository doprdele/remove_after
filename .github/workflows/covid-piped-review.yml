name: covid-piped-review
on:
  push:
    branches: [chatgpt-covid-lyrics-reel-20260907]
    paths: ['.github/workflows/covid-piped-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade requests 'yt-dlp[default]'
      - name: Retrieve public review proxies
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import requests, subprocess as sp, json, re, sys
          ROOT=Path('piped_review_v2');ROOT.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'})
          PIPED=['https://pipedapi.tokhmi.xyz','https://pipedapi.moomoo.me','https://pipedapi.syncpundit.io','https://api-piped.mha.fi','https://piped-api.garudalinux.org','https://pipedapi.kavin.rocks']
          INV=['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yt.chocolatemoo53.com','https://invidious.tiekoetter.com']
          IDS={'song':['mGGjRtSZrMo'],'er':['Cu2J8zRftJE','4NV_bb-BL1I','0P8KyaYuaTg'],'pyres':['vapEyLYgdDU','GwPE1vjpifs','zFZINTNQu_g'],'ventilator':['Xe-4p295SkY','OSfLd05B_Sw','aBoaCHKJKd8']}
          def qh(s):
            m=re.search(r'(\d+)',str(s));return int(m.group(1)) if m else 0
          def get(vid):
            errs=[]
            for b in PIPED:
              try:
                r=S.get(b+'/streams/'+vid,timeout=12)
                if r.ok:
                  d=r.json()
                  if d.get('videoStreams') or d.get('audioStreams'):return 'piped',b,d
                errs.append(f'{b}:{r.status_code}')
              except Exception as e:errs.append(f'{b}:{type(e).__name__}')
            for b in INV:
              try:
                r=S.get(b+'/api/v1/videos/'+vid+'?local=true',timeout=12)
                if r.ok:
                  d=r.json()
                  if d.get('formatStreams') or d.get('adaptiveFormats'):return 'inv',b,d
                errs.append(f'{b}:{r.status_code}')
              except Exception as e:errs.append(f'{b}:{type(e).__name__}')
            raise RuntimeError('; '.join(errs))
          def pick_video(kind,d,maxh=480):
            if kind=='piped':
              xs=[x for x in d.get('videoStreams',[]) if x.get('url')]
              def h(x):return int(x.get('height') or qh(x.get('quality')))
            else:
              xs=[x for x in d.get('formatStreams',[])+d.get('adaptiveFormats',[]) if x.get('url') and not str(x.get('type','')).startswith('audio/')]
              def h(x):return int(x.get('height') or qh(x.get('qualityLabel')))
            ys=[x for x in xs if 144<=h(x)<=maxh] or xs
            return max(ys,key=lambda x:(h(x),int(x.get('bitrate') or 0)))
          def pick_audio(kind,d):
            xs=d.get('audioStreams',[]) if kind=='piped' else [x for x in d.get('adaptiveFormats',[]) if str(x.get('type','')).startswith('audio/')]
            xs=[x for x in xs if x.get('url')]
            return max(xs,key=lambda x:int(x.get('bitrate') or 0))
          def save_url(url,path,video=True):
            cmd=['ffmpeg','-y','-hide_banner','-loglevel','error','-i',url]
            if video:cmd += ['-map','0:v:0','-an','-c:v','copy']
            else:cmd += ['-vn','-ar','48000','-ac','2','-c:a','pcm_s16le']
            cmd += [str(path)]
            sp.run(cmd,check=True,timeout=420)
          summary={}
          for cat,ids in IDS.items():
            for vid in ids:
              ddir=ROOT/cat/vid;ddir.mkdir(parents=True,exist_ok=True)
              try:
                kind,base,d=get(vid)
                (ddir/'api.json').write_text(json.dumps({'kind':kind,'base':base,'title':d.get('title'),'duration':d.get('duration') or d.get('lengthSeconds'),'uploader':d.get('uploader') or d.get('author')},indent=2,ensure_ascii=False))
                v=pick_video(kind,d,480);proxy=ddir/'proxy.mp4';save_url(v['url'],proxy,True)
                pr=json.loads(sp.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(proxy)]));dur=float(pr['format']['duration'])
                interval=max(dur/60,.5)
                vf=f"fps=1/{interval},scale=320:180:force_original_aspect_ratio=decrease,pad=320:180:(ow-iw)/2:(oh-ih)/2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='%{{pts\\:hms}}':fontsize=15:fontcolor=white:box=1:boxcolor=black@0.8:x=3:y=3,tile=6x10:padding=2:margin=2"
                sp.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-i',str(proxy),'-vf',vf,'-frames:v','1',str(ddir/'contact.jpg')],check=True,timeout=180)
                if cat=='song':
                  a=pick_audio(kind,d);save_url(a['url'],ROOT/'song_audio.wav',False)
                summary[vid]={'ok':True,'api':base,'kind':kind,'duration':dur}
              except Exception as e:
                (ddir/'error.log').write_text(type(e).__name__+': '+str(e));summary[vid]={'ok':False,'error':str(e)}
          if not (ROOT/'song_audio.wav').exists():
            sc='https://soundcloud.com/pika-lynx582/dogdog-abuse-ft-hatsune-miku'
            try:
              sp.run([sys.executable,'-m','yt_dlp','--no-progress','--no-playlist','-f','bestaudio/best','-x','--audio-format','wav','-o',str(ROOT/'song_audio.%(ext)s'),sc],check=True,timeout=360)
              summary['audio_fallback']={'ok':True,'url':sc}
            except Exception as e:summary['audio_fallback']={'ok':False,'error':str(e)}
          (ROOT/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False));print(json.dumps(summary,indent=2))
          PY
      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covid-piped-review-v2
          path: |
            piped_review_v2/**/*.json
            piped_review_v2/**/*.jpg
            piped_review_v2/**/*.log
          retention-days: 2
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covid-piped-media-v2
          path: |
            piped_review_v2/**/*.mp4
            piped_review_v2/song_audio.wav
          compression-level: 0
          retention-days: 2
          if-no-files-found: warn
