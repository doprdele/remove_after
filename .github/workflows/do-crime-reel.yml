name: do-crime-reel

on:
  push:
    branches:
      - chatgpt-do-crime-reel-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install media toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core fonts-gfs-didot curl
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" pillow
          yt-dlp --version
          ffmpeg -version | head -n 2

      - name: Patch renderer to sourced moving footage only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('chatgpt_do_crime/do_crime_render.sh')
          s=p.read_text()

          # Replace inaccessible Vimeo block with direct/alternate-host moving footage.
          m=re.search(r'# Exact requested Godard supermarket sequence, real FARC documentary footage, and real flag-burning protest footage\..*?# Exact track version',s,re.S)
          if not m:
              raise SystemExit('documentary source block not found')
          block=r'''# Sourced MOVING footage only. No Runway/generated replacements.
          # Exact Tout Va Bien 1080p BRRip from Internet Archive. The looting begins around 1:29:40.
          TOUT_URL='https://archive.org/download/tout.-va.-bien.-1972.-jean-luc.-godard.-1080p.-brrip.x-264-classics/Tout.Va.Bien.1972.%28Jean-Luc.Godard%29.1080p.BRRip.x264-Classics/Tout.Va.Bien.1972.%28Jean-Luc.Godard%29.1080p.BRRip.x264-Classics.mp4'
          ffmpeg -y -hide_banner -loglevel warning -ss 5365 -i "$TOUT_URL" -t 75 -an -c:v libx264 -preset veryfast -crf 17 -movflags +faststart work/raw/tout.mp4

          # Genuine FARC-EP documentary footage mirrored on Dailymotion; use the training/formation passage.
          rm -f work/raw/farc.* 2>/dev/null || true
          yt-dlp --no-playlist --retries 8 --fragment-retries 8 --socket-timeout 45 \
            --download-sections '*20:20-24:20' --force-keyframes-at-cuts \
            -f 'bestvideo[height>=1080]+bestaudio/best[height>=1080]' --merge-output-format mp4 \
            -o 'work/raw/farc.%(ext)s' 'https://www.dailymotion.com/video/x9gr61a'
          farc=$(find work/raw -maxdepth 1 -type f -name 'farc.*' ! -name '*.part' | head -n1)
          test -s "$farc"
          [ "$farc" = work/raw/farc.mp4 ] || mv "$farc" work/raw/farc.mp4

          # Genuine left-wing flag-burning protest; original CC file is native 1920x1080.
          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/DNC_Day_4-_Protesters_Attempt_To_Burn_A_Flag.webm' work/raw/flag.webm
          ffmpeg -y -hide_banner -loglevel warning -i work/raw/flag.webm -t 21 -an -c:v libx264 -preset veryfast -crf 17 -movflags +faststart work/raw/flag.mp4

          # Exact track/version from the artist's official Audiomack page.
          rm -f work/audio/raya_source.* 2>/dev/null || true
          yt-dlp --no-playlist --retries 8 --socket-timeout 45 -f 'bestaudio/best' -x --audio-format m4a --audio-quality 0 \
            -o 'work/audio/raya_source.%(ext)s' 'https://audiomack.com/zericxxn/song/raya-slowed'
          audio=$(find work/audio -maxdepth 1 -type f -name 'raya_source.*' ! -name '*.part' | head -n1)
          test -s "$audio"
          ffmpeg -y -v warning -i "$audio" -vn -c:a aac -b:a 256k -ar 48000 -ac 2 work/audio/raya_master.m4a

          # Exact track version'''
          s=s[:m.start()]+block+s[m.end():]

          # Remove the old Audiomack fallback block duplicated after the marker.
          a=s.index('# Exact track version', s.index('work/audio/raya_master.m4a'))
          b=s.index('# Hard source-resolution gate', a)
          s=s[:a]+s[b:]

          # Preserve the established 55-slot / 110-BPM-style timing and selected audio region.
          s=s.replace('S=15/49; N=49','S=3/11; N=55')
          s=s.replace("zip([7,8,9,10],[0,17,34,48])","zip([7,8,9,10],[0,20,40,54])")
          if '-i work/src/flag.mp4 -i work/audio/raya_master.m4a' in s:
              s=s.replace('-i work/src/flag.mp4 -i work/audio/raya_master.m4a','-i work/src/flag.mp4 -ss 44.742 -i work/audio/raya_master.m4a')
          p.write_text(s)

          low=s.lower()
          assert 'runway' not in low
          assert 'dnznrvs05pmza.cloudfront.net' not in low
          assert 'tout_still' not in low and 'farc_still' not in low
          assert 'S=3/11; N=55' in s
          print('Moving-footage-only renderer patched')
          PY

      - name: Render reel
        shell: bash
        run: |
          mkdir -p work/qc output
          set -o pipefail
          bash chatgpt_do_crime/do_crime_render.sh 2>&1 | tee work/qc/build.log

      - name: Verify technical requirements
        if: success()
        run: |
          python - <<'PY'
          import json,subprocess
          p='output/do_crime_dont_vote_reel.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_entries','format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels,nb_read_frames','-of','json',p])
          d=json.loads(raw); ss={x['codec_type']:x for x in d['streams']}; v=ss['video']; a=ss['audio']
          assert abs(float(d['format']['duration'])-15.0)<.025,d
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['codec_name']=='h264' and v['r_frame_rate']=='60/1',v
          assert int(v['nb_read_frames'])==900,v
          assert a['codec_name']=='aac' and a['sample_rate']=='48000',a
          open('work/qc/verified_ffprobe.json','wb').write(raw)
          print('FINAL QC PASSED')
          PY
          ffmpeg -v error -i output/do_crime_dont_vote_reel.mp4 -f null -

      - name: Upload output and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-dont-vote-reel
          path: |
            output/
            work/qc/
            chatgpt_do_crime/do_crime_render.sh
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
