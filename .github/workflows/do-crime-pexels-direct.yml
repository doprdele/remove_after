name: do-crime-pexels-direct

on:
  push:
    branches:
      - chatgpt-do-crime-pexels-direct-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl fonts-dejavu-core
          ffmpeg -version | head -n 2

      - name: Probe direct Pexels downloads
        shell: bash
        run: |
          chmod +x chatgpt_do_crime/probe_pexels_direct.sh
          chatgpt_do_crime/probe_pexels_direct.sh

      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-crime-pexels-direct
          path: probe/
          compression-level: 6
          retention-days: 2
          if-no-files-found: warn
