name: archive-probe
on:
  push:
    branches: [chatgpt-do-crime-reel-20260903]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Internet Archive metadata and search FARC video items
        run: |
          set -euxo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq curl >/dev/null
          mkdir -p out

          ITEM='tout.-va.-bien.-1972.-jean-luc.-godard.-1080p.-brrip.x-264-classics'
          curl -fsSL --retry 3 "https://archive.org/metadata/${ITEM}" -o out/tout_metadata.json
          echo '=== TOUT FILES ==='
          jq -r '.files[] | select((.name|ascii_downcase|test("\\.(mkv|mp4|avi|mov)$"))) | [.name,.size,.source,.format] | @tsv' out/tout_metadata.json | sort -k2,2nr | tee out/tout_files.tsv

          echo '=== FARC SEARCH ==='
          q='(title:(FARC OR guerrilla OR Colombia) OR description:(FARC OR "FARC-EP")) AND mediatype:movies'
          curl -G -fsSL --retry 3 'https://archive.org/advancedsearch.php' \
            --data-urlencode "q=${q}" --data-urlencode 'fl[]=identifier' --data-urlencode 'fl[]=title' \
            --data-urlencode 'fl[]=description' --data-urlencode 'rows=50' --data-urlencode 'output=json' \
            -o out/farc_search.json
          jq -r '.response.docs[] | [.identifier,.title] | @tsv' out/farc_search.json | tee out/farc_items.tsv

          echo '=== CANDIDATE VIDEO FILES ==='
          : > out/farc_files.tsv
          head -n 30 out/farc_items.tsv | while IFS=$'\t' read -r id title; do
            curl -fsSL --retry 2 "https://archive.org/metadata/${id}" -o out/tmp.json || continue
            jq -r --arg id "$id" --arg title "$title" '.files[] | select((.name|ascii_downcase|test("\\.(mkv|mp4|webm|mov)$"))) | [$id,$title,.name,.size,.source,.format] | @tsv' out/tmp.json >> out/farc_files.tsv || true
          done
          sort -t$'\t' -k4,4nr out/farc_files.tsv | head -n 100 | tee out/farc_files_top.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: archive-probe
          path: out/
          retention-days: 1
