name: covid-embedded-test
on:
  push:
    branches: [chatgpt-covid-lyrics-reel-20260907]
    paths: ['.github/workflows/covid-embedded-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade 'yt-dlp[default]'
      - shell: bash
        run: |
          set +e
          mkdir out
          NODE=$(command -v node)
          for id in mGGjRtSZrMo Cu2J8zRftJE vapEyLYgdDU GwPE1vjpifs aBoaCHKJKd8 Xe-4p295SkY; do
            echo ===$id=== >>out/results.log
            yt-dlp -v --force-ipv4 --js-runtimes "node:$NODE" --extractor-args 'youtube:player_client=web_embedded;formats=missing_pot' --skip-download -F "https://www.youtube.com/embed/$id" >>out/results.log 2>&1
            echo RETURN=$? >>out/results.log
          done
          yt-dlp -v --force-ipv4 --js-runtimes "node:$NODE" --extractor-args 'youtube:player_client=web_embedded;formats=missing_pot' --download-sections '*0-4' -f 'bestvideo[height<=720]+bestaudio/best[height<=720]/best' --merge-output-format mp4 -o 'out/test.%(ext)s' 'https://www.youtube.com/embed/Cu2J8zRftJE' >>out/results.log 2>&1
          echo MEDIA_RETURN=$? >>out/results.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: covid-embedded-test
          path: out/
          retention-days: 2
